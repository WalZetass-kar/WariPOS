<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' ws://localhost:* http://localhost:* https://*.supabase.co wss://*.supabase.co https://api.openai.com https://generativelanguage.googleapis.com https://api.deepseek.com https://openrouter.ai https://bluesminds.com; font-src 'self' data:; frame-src 'none';" />
    <link rel="icon" type="image/png" href="./icon.png" />
    <title>WariPOS</title>
    <script>
      (function() {
        try {
          var mode = localStorage.getItem('waripos_theme_mode') || localStorage.getItem('theme-mode') || 'system';
          var isDark = mode === 'dark' || (mode === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
          var color = localStorage.getItem('waripos_theme_color') || localStorage.getItem('theme-color') || 'crimson';
          if (color.indexOf('#') === 0) {
            document.documentElement.setAttribute('data-theme', 'custom');
          } else {
            document.documentElement.setAttribute('data-theme', color);
          }
          var font = localStorage.getItem('waripos_font_size') || 'normal';
          document.documentElement.setAttribute('data-font-size', font);
          var radius = localStorage.getItem('waripos_border_radius') || 'rounded';
          document.documentElement.setAttribute('data-radius', radius);
        } catch (e) {}
      })();
      window.addEventListener('error', function(e) {
        var root = document.getElementById('root');
        if (root && (!root.innerHTML || root.innerHTML.trim() === '')) {
          root.innerHTML = '<div style="padding:24px;font-family:sans-serif;background:#0f172a;color:#f8fafc;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;"><h2 style="font-size:18px;font-weight:bold;margin-bottom:8px;">Gagal Memuat Aplikasi</h2><p style="font-size:12px;color:#94a3b8;max-width:320px;word-break:break-all;">' + (e.message || 'Script error') + '</p><button onclick="location.reload()" style="margin-top:16px;padding:8px 16px;background:#ef4444;color:white;border:none;border-radius:8px;font-weight:bold;cursor:pointer;">Muat Ulang</button></div>';
        }
      });
    </script>
  </head>
  <body class="bg-slate-100 dark:bg-slate-950">
    <div id="root"></div>
    <script type="module" src="/src/renderer/main.tsx"></script>
  </body>
</html>
