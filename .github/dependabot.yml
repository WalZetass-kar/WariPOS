version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dependencies:
        patterns: ['*']
    labels:
      - dependencies

  - package-ecosystem: npm
    directory: /license-server
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - ci

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: monthly
    labels:
      - dependencies
